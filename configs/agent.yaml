# Marketing Agent Configuration
# Project-agnostic — project context is loaded dynamically from Auxia Console API

# LLM models
models:
  orchestrator: claude-sonnet-4-6  # Main reasoning loop
  subagent: claude-sonnet-4-6      # Scoped child tasks
  classifier: claude-haiku-4-5-20251001  # Fan-out classification

# Token budgets
tokens:
  max_context: 180000        # Max tokens in context window
  max_output: 8192           # Max output tokens per turn
  compaction_threshold: 120000  # Trigger compaction at this level
  summary_target: 4000       # Target size for compacted summary

# BigQuery
bigquery:
  project: ${BQ_PROJECT:-auxia-reporting}
  dataset: ${BQ_DATASET:-agent_dataset}
  location: US
  max_bytes_billed: 10737418240  # 10 GB safety limit

# GCS persistence
gcs:
  bucket: ${GCS_BUCKET:-auxia-agent}
  session_prefix: agent/sessions/
  artifact_prefix: agent/artifacts/
  memory_prefix: agent/memory/

# Agent behavior
agent:
  max_turns: 50              # Max ReAct loop iterations
  max_plan_steps: 20         # Max steps in a plan
  checkpoint_interval: 5     # Checkpoint to GCS every N turns
  enable_subagents: true
  enable_fan_out: true
  fan_out_max_parallel: 20   # Max concurrent Haiku classifiers
  context_buffer_threshold: 50  # Rows above this get buffered to GCS

# Auxia Console API
auxia:
  enabled: true
  bff_base_url: ${AUXIA_BFF_URL:-https://console.auxia.io}

# Project ID — set via CLI --project flag or env var
project_id: ${AUXIA_PROJECT_ID:-}
