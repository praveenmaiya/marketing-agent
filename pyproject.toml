[project]
name = "marketing-agent"
version = "0.1.0"
description = "Long-running marketing agent for campaign analysis on GCP"
requires-python = ">=3.12"

dependencies = [
    "anthropic>=0.40",
    "google-cloud-bigquery>=3.0",
    "google-cloud-storage>=2.0",
    "pandas>=2.0",
    "tabulate>=0.9",
    "numpy>=1.24",
    "metaflow>=2.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]
